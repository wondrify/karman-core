apply plugin: 'groovy'
apply plugin: 'java-library'

group = 'cloud.wondrify'

ext {
    pomDescription = 'Karman Storage Provider interface for Google storage services'
}

configurations {
    provided
}
sourceSets {
    main {
        compileClasspath += configurations.provided
    }
}


dependencies {
    implementation "org.apache.groovy:groovy-all:$groovyVersion"
    implementation 'com.google.auth:google-auth-library-oauth2-http:0.24.0'
    implementation 'com.google.apis:google-api-services-storage:v1-rev148-1.25.0'
    api project(':karman-core')
    api 'org.apache.httpcomponents:httpcore:4.4.16'
    api 'org.apache.httpcomponents:httpclient:4.5.2'
    api 'org.apache.httpcomponents:httpmime:4.5.2'
    api group: 'commons-beanutils', name: 'commons-beanutils', version: '1.9.4'

    testImplementation 'org.spockframework:spock-core:2.3-groovy-4.0'


}

task(console, dependsOn: 'classes', type: JavaExec) {
  main = 'groovy.ui.Console'
  classpath = sourceSets.main.runtimeClasspath
}

test {
    systemProperties System.properties
    testLogging {
        exceptionFormat = 'full'
        showStandardStreams = true
        events 'started', 'passed'
    }
}

apply {
    from rootProject.layout.projectDirectory.file('gradle/java-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/publish-config.gradle')
}
